<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>เปรียบเทียบราคา — PriceCompare GPU</title>

  <meta
    name="description"
    content="เปรียบเทียบราคาการ์ดจอจาก JIB, BaNANA และ iHAVECPU"
  >

  <link rel="stylesheet" href="css/styles.css">

  <style>
    /* =========================================================
       COMPARE PAGE
       ========================================================= */

    .compare-page {
      min-height: 100vh;
    }

    .compare-header {
      padding: 42px 0 28px;

      background: var(--bg-surface);

      border-bottom: 1px solid var(--border);
    }

    .compare-kicker {
      color: var(--primary-light);

      font-size: 11px;
      font-weight: 700;
      letter-spacing: .8px;

      margin-bottom: 9px;
    }

    .compare-header h1 {
      margin: 0;

      font-size: 27px;
      font-weight: 800;

      letter-spacing: -.7px;
    }

    .compare-header p {
      margin-top: 8px;

      color: var(--text-secondary);

      font-size: 13px;
    }

    /* Search */

    .compare-search-area {
      padding: 24px 0;

      background: var(--bg-base);

      border-bottom: 1px solid var(--border);
    }

    .compare-search {
      width: min(700px, 100%);
    }

    .compare-search-box {
      height: 46px;

      display: flex;
      align-items: center;

      padding: 0 6px 0 14px;

      background: #0c131b;

      border: 1px solid var(--border);
      border-radius: 7px;
    }

    .compare-search-box span {
      color: var(--text-muted);

      margin-right: 10px;
    }

    .compare-search-box input {
      flex: 1;

      min-width: 0;

      height: 100%;

      border: 0;
      outline: 0;

      background: transparent;

      color: var(--text-primary);

      font-family: inherit;
      font-size: 13px;
    }

    .compare-search-box button {
      height: 34px;
    }

    /* Content */

    .compare-content {
      padding: 32px 0 70px;
    }

    .compare-empty {
      padding: 80px 20px;

      text-align: center;

      color: var(--text-muted);

      border: 1px dashed var(--border);
      border-radius: 9px;
    }

    .compare-empty strong {
      display: block;

      margin-bottom: 7px;

      color: var(--text-secondary);

      font-size: 15px;
    }

    /* Product summary */

    .compare-product {
      display: grid;

      grid-template-columns: 190px 1fr;

      gap: 24px;

      padding: 20px;

      background: var(--bg-card);

      border: 1px solid var(--border);
      border-radius: 9px;
    }

    .compare-product-image {
      height: 145px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #eef1f4;

      border-radius: 7px;
    }

    .compare-product-image img {
      width: 100%;
      height: 100%;

      padding: 10px;

      object-fit: contain;
    }

    .compare-product-brand {
      color: var(--text-muted);

      font-size: 10px;
      font-weight: 700;

      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .compare-product-name {
      margin-top: 5px;

      color: var(--text-primary);

      font-size: 19px;
      font-weight: 750;

      line-height: 1.4;
    }

    .compare-specs {
      display: flex;
      flex-wrap: wrap;

      gap: 6px;

      margin-top: 12px;
    }

    .compare-spec {
      padding: 4px 7px;

      background: #0d151e;

      border: 1px solid var(--border);

      border-radius: 4px;

      color: var(--text-secondary);

      font-size: 10px;
    }

    /* Price summary */

    .price-summary {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;

      gap: 20px;

      margin-top: 24px;
    }

    .price-summary-main {
      display: flex;
      align-items: baseline;

      gap: 10px;
    }

    .price-summary-label {
      color: var(--text-muted);

      font-size: 11px;
    }

    .price-summary-value {
      color: var(--green);

      font-size: 27px;
      font-weight: 800;

      letter-spacing: -.5px;
    }

    .price-summary-diff {
      color: var(--text-muted);

      font-size: 11px;
    }

    /* Price table */

    .price-table-section {
      margin-top: 18px;

      background: var(--bg-card);

      border: 1px solid var(--border);
      border-radius: 9px;

      overflow: hidden;
    }

    .price-table-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 16px 18px;

      border-bottom: 1px solid var(--border);
    }

    .price-table-header h2 {
      margin: 0;

      font-size: 14px;
      font-weight: 700;
    }

    .price-table-header span {
      color: var(--text-muted);

      font-size: 10px;
    }

    .price-table {
      width: 100%;

      border-collapse: collapse;
    }

    .price-table th,
    .price-table td {
      padding: 13px 16px;

      text-align: left;

      border-bottom: 1px solid var(--border);
    }

    .price-table th {
      background: #101720;

      color: var(--text-muted);

      font-size: 10px;
      font-weight: 650;

      text-transform: uppercase;
      letter-spacing: .4px;
    }

    .price-table td {
      color: var(--text-primary);

      font-size: 12px;
    }

    .price-table tbody tr:last-child td {
      border-bottom: 0;
    }

    .price-table tbody tr:hover td {
      background: #111a24;
    }

    .store-cell {
      font-weight: 650;
    }

    .price-cell {
      font-size: 15px !important;
      font-weight: 750;
    }

    .lowest-row td {
      background: rgba(34, 197, 94, .035);
    }

    .lowest-label {
      display: inline-block;

      margin-left: 7px;

      padding: 3px 6px;

      border: 1px solid rgba(34, 197, 94, .25);
      border-radius: 4px;

      color: var(--green);

      font-size: 9px;
      font-weight: 700;
    }

    .availability {
      color: var(--text-muted);

      font-size: 10px;
    }

    .view-product {
      display: inline-flex;
      align-items: center;

      height: 30px;

      padding: 0 10px;

      background: transparent;

      border: 1px solid var(--border-light);
      border-radius: 5px;

      color: var(--text-secondary);

      font-family: inherit;
      font-size: 10px;
      font-weight: 600;
    }

    .view-product:hover {
      color: var(--text-primary);

      background: #18222d;

      border-color: #526173;
    }

    /* Loading */

    .compare-loading {
      padding: 70px 20px;

      text-align: center;

      color: var(--text-muted);

      font-size: 12px;
    }

    /* Mobile */

    @media (max-width: 700px) {

      .compare-product {
        grid-template-columns: 1fr;
      }

      .compare-product-image {
        height: 190px;
      }

      .price-summary {
        align-items: flex-start;
        flex-direction: column;
      }

      .price-table-section {
        overflow-x: auto;
      }

      .price-table {
        min-width: 620px;
      }
    }
  </style>
</head>

<body class="compare-page">

  <!-- NAVBAR -->

  <nav class="navbar" id="navbar">

    <div class="container">

      <a href="index.html" class="nav-logo">

        <div class="logo-icon">
          PC
        </div>

        <span class="logo-text">
          PriceCompare <span>GPU</span>
        </span>

      </a>

      <ul class="nav-links" id="navLinks">

        <li>
          <a href="index.html">
            หน้าแรก
          </a>
        </li>

        <li>
          <a href="gpu.html">
            GPU ทั้งหมด
          </a>
        </li>

        <li>
          <a href="compare.html" class="active">
            เปรียบเทียบ
          </a>
        </li>

        <li>
          <a href="history.html">
            ประวัติราคา
          </a>
        </li>

        <li>
          <a href="admin.html">
            Admin
          </a>
        </li>

      </ul>

      <div class="nav-right">

        <a
          href="gpu.html"
          class="btn btn-primary btn-sm"
        >
          ค้นหา GPU
        </a>

        <button
          class="nav-toggle"
          id="navToggle"
          aria-label="เปิดเมนู"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>

      </div>

    </div>

  </nav>


  <!-- HEADER -->

  <header class="compare-header">

    <div class="container">

      <div class="compare-kicker">
        PRICE COMPARISON
      </div>

      <h1>
        เปรียบเทียบราคา
      </h1>

      <p>
        ดูราคาของ GPU รุ่นเดียวกันจากแต่ละร้านในหน้าเดียว
      </p>

    </div>

  </header>


  <!-- SEARCH -->

  <section class="compare-search-area">

    <div class="container">

      <form
        class="compare-search"
        id="compareSearchForm"
      >

        <div class="compare-search-box">

          <span>⌕</span>

          <input
            type="text"
            id="compareSearchInput"
            placeholder="ค้นหารุ่น เช่น RTX 5070, RTX 5060..."
            autocomplete="off"
          >

          <button
            type="submit"
            class="btn btn-primary"
          >
            ค้นหา
          </button>

        </div>

      </form>

    </div>

  </section>


  <!-- CONTENT -->

  <main class="compare-content">

    <div class="container">

      <div id="compareContent">

        <div class="compare-empty">

          <strong>
            เลือก GPU ที่ต้องการเปรียบเทียบ
          </strong>

          ค้นหาชื่อรุ่นด้านบน หรือเลือกจากหน้า GPU ทั้งหมด

        </div>

      </div>

    </div>

  </main>


  <script src="js/compare.js"></script>

</body>
</html>
